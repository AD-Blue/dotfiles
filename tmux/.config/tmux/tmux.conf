bind -n M-h resize-pane -L
bind -n M-l resize-pane -R
bind -n M-k resize-pane -U
bind -n M-j resize-pane -D

set-option -g prefix2 C-a

bind-key C-a send-prefix -2

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

set -sg escape-time 0

set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# hightlight tabs that printed output while unfocused
setw -g monitor-activity on
set  -g visual-activity off
#setw -g window-status-activity-style 'fg=#f9e2af bold'

# windows and statusline
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_flags 'icon'

# catppuccin's window text defaults to the pane title (#T); we want it to
# track automatic-rename's directory-based window name (#W) instead
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

# 12h clock, mm-dd-yyyy date
set -g @catppuccin_date_time_text ' %m-%d-%Y %I:%M %p'

bind R source-file ~/.config/tmux/tmux.conf \; display 'reloaded'
set -g @plugin "sainnhe/tmux-fzf"
set -g @plugin "catppuccin/tmux"
set -g @plugin "tmux-plugins/tmux-cpu"
set -g @plugin "tmux-plugins/tmux-battery"

run 'tpack init'

# status-left/status-right must be set after the plugins above have run, so
# that the @catppuccin_status_* module variables are already defined

# far left: session name, then the window list
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"

# left to right: CPU, battery, time
set -g status-right-length 100
set -g status-right ""
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -agF status-right "#{E:@catppuccin_status_date_time}"

# tmux-cpu/tmux-battery replace the "#{cpu_percentage}"-style placeholders
# baked into status-right above with live "#(script)" commands, but only in
# whatever plugins run *after* the placeholders exist - hence sourcing again
run 'tpack source'

# use active pane dir for window name
setw -g automatic-rename on
set  -g automatic-rename-format '#{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}}'
set  -g allow-rename off

set -g history-limit 50000
set -g display-time 4000
set -g status-interval 10

# enables vim motions when in copy mode
set-window-option -g mode-keys vi
